# Grimoire book configuration for the @deckyard/docker documentation.

[book]
title = "@deckyard/docker"
description = "A client for the Docker Engine API (and Podman's): containers, images, networks, volumes, exec and system"
language = "en"
src = "docs"

[build]
out = "site"
clean = true
jobs = 0

[html]
theme = "carbon"
mode = "auto"
navPosition = "left"
tocPosition = "right"
tocDepth = 3
sectionNumbers = true
titleUrl = "https://deckyard.github.io/deck-docker/"
repoUrl = "https://github.com/deckyard/deck-docker"
repoLabel = "Source"
editUrl = "https://github.com/deckyard/deck-docker/edit/main/docs/{path}"

[highlight]
enabled = true

[search]
enabled = true

[pdf]
enabled = false
